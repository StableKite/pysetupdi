name: Installed Windows PEP 561 contracts
on:
  workflow_dispatch:
  push:
    branches: [engineering/stored-instance-id-v2]
  pull_request:
permissions:
  contents: read
jobs:
  installed:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ["3.13", "3.15.2t"]
        form: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build real distributions and install qualified checkers
        shell: bash
        run: |
          python -m pip install build wheel "mypy @ git+https://github.com/StableKite/mypy.git@35056bb452dd2e06074d06920ee25ae6e032099e" "pyright[nodejs] @ git+https://github.com/StableKite/pyright-python.git@87aa8777187d9bbe31057ecd3be16cd9e3efed75"
          python -m build
      - name: Install the real wheel or rebuild the real sdist
        shell: bash
        env:
          FORM: ${{ matrix.form }}
        run: |
          if [ "$FORM" = sdist ]; then
            python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
            python -m pip install rebuilt/*.whl
          else
            python -m pip install dist/*.whl
          fi
      - name: Check all installed public interfaces and genuine negative cases
        run: python -I ci_typing_contract.py
      - name: Read-only real Windows API and parser tests
        if: runner.os == 'Windows'
        run: python -I -m unittest discover -s tests -p "test*.py" -v
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ runner.os }}-${{ matrix.python }}-${{ matrix.form }}
          path: typing-contract-results
